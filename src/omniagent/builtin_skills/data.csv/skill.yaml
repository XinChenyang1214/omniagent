{
  "name": "builtin.data.csv",
  "version": "0.1.0",
  "description": "Read, select, filter, aggregate, report, and write CSV data with stdlib only.",
  "input_schema": {"action": "string", "path": "string", "rows": "array", "columns": "array", "filters": "array", "aggregate": "object", "metrics": "array", "output_path": "string", "delimiter": "string"},
  "output_schema": {"rows": "array", "columns": "array", "row_count": "integer", "result": "object", "path": "string"},
  "permission_requirements": ["filesystem.read"],
  "dependency_requirements": [],
  "side_effects": ["workspace_files"],
  "sandbox_level": "workspace",
  "tags": ["csv", "data", "builtin"],
  "contracts": [
    {
      "action": "read",
      "description": "Read CSV rows from a workspace file",
      "input_fields": [
        {"name": "action", "type": "string", "required": true},
        {"name": "path", "type": "string", "required": true},
        {"name": "delimiter", "type": "string", "required": false}
      ],
      "output_fields": [
        {"name": "rows", "type": "array"},
        {"name": "columns", "type": "array"},
        {"name": "row_count", "type": "integer"},
        {"name": "path", "type": "string"}
      ],
      "side_effects": []
    },
    {
      "action": "select",
      "description": "Select a subset of columns from CSV rows or a file",
      "input_fields": [
        {"name": "action", "type": "string", "required": true},
        {"name": "path", "type": "string", "required": false},
        {"name": "rows", "type": "array", "required": false},
        {"name": "columns", "type": "array", "required": true},
        {"name": "delimiter", "type": "string", "required": false}
      ],
      "output_fields": [
        {"name": "rows", "type": "array"},
        {"name": "columns", "type": "array"},
        {"name": "row_count", "type": "integer"},
        {"name": "path", "type": "string"}
      ],
      "side_effects": []
    },
    {
      "action": "filter",
      "description": "Filter rows with equals, contains, gt, gte, lt, or lte",
      "input_fields": [
        {"name": "action", "type": "string", "required": true},
        {"name": "path", "type": "string", "required": false},
        {"name": "rows", "type": "array", "required": false},
        {"name": "filters", "type": "array", "required": true},
        {"name": "delimiter", "type": "string", "required": false}
      ],
      "output_fields": [
        {"name": "rows", "type": "array"},
        {"name": "columns", "type": "array"},
        {"name": "row_count", "type": "integer"},
        {"name": "path", "type": "string"}
      ],
      "side_effects": []
    },
    {
      "action": "aggregate",
      "description": "Aggregate rows with count, sum, avg, min, or max",
      "input_fields": [
        {"name": "action", "type": "string", "required": true},
        {"name": "path", "type": "string", "required": false},
        {"name": "rows", "type": "array", "required": false},
        {"name": "aggregate", "type": "object", "required": true},
        {"name": "delimiter", "type": "string", "required": false}
      ],
      "output_fields": [
        {"name": "rows", "type": "array"},
        {"name": "columns", "type": "array"},
        {"name": "row_count", "type": "integer"},
        {"name": "result", "type": "object"},
        {"name": "path", "type": "string"}
      ],
      "side_effects": []
    },
    {
      "action": "report",
      "description": "Compute one or more aggregate metrics and write a label: value text report",
      "input_fields": [
        {"name": "action", "type": "string", "required": true},
        {"name": "path", "type": "string", "required": false},
        {"name": "rows", "type": "array", "required": false},
        {"name": "metrics", "type": "array", "required": true},
        {"name": "output_path", "type": "string", "required": true},
        {"name": "delimiter", "type": "string", "required": false},
        {"name": "overwrite", "type": "boolean", "required": false}
      ],
      "output_fields": [
        {"name": "rows", "type": "array"},
        {"name": "columns", "type": "array"},
        {"name": "row_count", "type": "integer"},
        {"name": "result", "type": "object"},
        {"name": "path", "type": "string"},
        {"name": "output_path", "type": "string"}
      ],
      "side_effects": ["filesystem.write"]
    },
    {
      "action": "write",
      "description": "Write rows to a workspace CSV file",
      "input_fields": [
        {"name": "action", "type": "string", "required": true},
        {"name": "rows", "type": "array", "required": true},
        {"name": "columns", "type": "array", "required": false},
        {"name": "output_path", "type": "string", "required": true},
        {"name": "delimiter", "type": "string", "required": false}
      ],
      "output_fields": [
        {"name": "rows", "type": "array"},
        {"name": "columns", "type": "array"},
        {"name": "row_count", "type": "integer"},
        {"name": "path", "type": "string"}
      ],
      "side_effects": ["filesystem.write"]
    }
  ]
}

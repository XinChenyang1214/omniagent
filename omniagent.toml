# OmniAgent 配置文件
# 环境变量优先级高于此文件（环境变量会覆盖文件中的值）

[llm]
provider = "opencode"         # 默认使用 OpenCode Zen 限时免费模型
model = "deepseek-v4-flash-free"
# api_key intentionally omitted; use OPENCODE_API_KEY
api_base = "https://opencode.ai/zen/v1"
temperature = 0.0             # 生成温度
timeout_seconds = 120         # 单次请求超时（秒）
max_retries = 2               # 失败重试次数
fallback_provider = ""        # 降级 provider（主 provider 失败时切换）
enable_runtime_fallback = false
verify_on_startup = false     # 启动时是否执行 LLM 健康检查
opencode_free_only = true     # 阻止误用未带 -free 后缀的付费模型
opencode_allow_anonymous = true # 临时允许无 Key 请求；上游仍可能拒绝

[embedding]
enabled = true
provider = "local_model"
model = "bge-small-zh-v1.5"
model_path = "models/embedding/bge-small-zh-v1.5/onnx/model_quantized.onnx"
tokenizer_path = "models/embedding/bge-small-zh-v1.5/tokenizer.json"
dimensions = 512
pooling = "cls"
normalize = true
max_tokens = 512
timeout_seconds = 30
max_retries = 1

[gateway]
app_name = "omniagent"
default_mode = "semi_auto"    # assist / semi_auto / full_auto
task_timeout_seconds = 1200   # 默认任务超时（秒），CLI --timeout 可覆盖

[sandbox]
enabled = true
timeout_seconds = 30
allow_network = false
# authorized_paths = ["~/Downloads", "~/Desktop"]
# path_intents = {下载 = "~/Downloads", 桌面 = "~/Desktop"}

[playwright]
enabled = false
browser = "chromium"

[logging]
level = "INFO"
json_logs = true
# file_path = ""              # 留空则使用默认路径 artifacts/omniagent.log
